```html
<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftHub Universe — คลังแสงมอด Minecraft Mobile & PC</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            950: '#0c071e',
                        },
                        cyber: {
                            dark: '#05070e',
                            card: 'rgba(15, 23, 42, 0.75)',
                            border: 'rgba(139, 92, 246, 0.25)',
                            cyan: '#06b6d4',
                            pink: '#ec4899',
                            emerald: '#10b981'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'glowPulse 3s ease-in-out infinite alternate',
                        'modal-in': 'modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'card-appear': 'cardAppear 0.4s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glowPulse: {
                            '0%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.3)' },
                            '100%': { boxShadow: '0 0 35px rgba(236, 72, 153, 0.6)' }
                        },
                        modalIn: {
                            '0%': { opacity: '0', transform: 'scale(0.92) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        cardAppear: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & JSZip CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS Styles -->
    <style>
        body {
            font-family: 'Kanit', 'Plus Jakarta Sans', sans-serif;
            background-color: #05070e;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(13, 18, 36, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.6);
            transform: translateY(-6px);
            box-shadow: 0 15px 35px -10px rgba(139, 92, 246, 0.4);
        }

        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #ec4899 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #080c14;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4c1d95;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #8b5cf6;
        }

        .toast-animation {
            animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastIn {
            from { transform: translateY(100%) scale(0.85); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white relative">

    <!-- Interactive Particle Background Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-purple-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center gap-3 cursor-pointer select-none group" onclick="resetAllFilters()">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-purple-600 via-indigo-600 to-pink-600 flex items-center justify-center text-white text-xl shadow-lg shadow-purple-600/40 group-hover:rotate-12 transition-transform duration-300">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-xl font-extrabold tracking-tight gradient-text">CraftHub</span>
                        <span class="text-[10px] bg-purple-950/90 text-purple-300 font-semibold px-2 py-0.5 rounded-full border border-purple-500/40">v4.0 UNIVERSE</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-light hidden sm:block">มอด Minecraft Mobile & PC ลงได้จริง 100%</p>
                </div>
            </div>

            <!-- Global Search Box -->
            <div class="hidden md:flex flex-1 max-w-lg relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-purple-400"></i>
                <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="ค้นหาสกิลมอด, .mcaddon, .mcpack, .zip, .jar..." 
                    class="w-full pl-11 pr-10 py-2.5 bg-slate-950/90 border border-purple-500/30 rounded-2xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-2 focus:ring-purple-500/30 transition-all">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3">
                <button onclick="openUploadModal()" class="relative group bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold text-xs px-4 py-2.5 rounded-2xl shadow-lg shadow-purple-900/50 flex items-center gap-2 transition-all duration-300 transform active:scale-95 animate-glow-pulse">
                    <i class="fa-solid fa-cloud-arrow-up text-sm group-hover:-translate-y-0.5 transition-transform"></i>
                    <span>อัปโหลดแชร์มอด</span>
                </button>
            </div>
        </div>

        <!-- Mobile Search Input Bar -->
        <div class="p-3 md:hidden border-t border-slate-800/80 bg-slate-950/95">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-purple-400"></i>
                <input type="text" id="mobileSearchInput" oninput="syncSearchMobile()" placeholder="ค้นหาชื่อมอด หรือแอดออน..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-900 border border-purple-500/30 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-purple-500">
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full space-y-8 z-10 relative">

        <!-- Hero Welcome Banner -->
        <div class="relative rounded-3xl glass-panel p-6 sm:p-8 overflow-hidden shadow-2xl border border-purple-500/40">
            <div class="absolute -right-16 -top-16 w-96 h-96 bg-purple-600/25 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
            <div class="absolute right-1/4 -bottom-24 w-80 h-80 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 max-w-2xl space-y-4">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-950/80 border border-purple-500/50 text-purple-300 text-xs font-medium backdrop-blur-md">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>ระบบรองรับการอัปโหลดไฟล์ตรงจากมือถือ & PC 100%</span>
                </div>

                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white leading-snug">
                    ศูนย์รวมมอด <span class="gradient-text">Minecraft Mobile & PC</span> <br class="hidden sm:inline">
                    รองรับไฟล์ .mcaddon, .mcpack, .zip, .jar
                </h1>

                <p class="text-slate-300 text-xs sm:text-sm leading-relaxed font-light">
                    เลือกดาวน์โหลดมอดและแอดออนคุณภาพสูงไปติดตั้งเปิดเล่นได้ทันที หรือแชร์มอดของคุณเองด้วยการแนบรูปจากอัลบั้มและไฟล์มอดต้นฉบับตรงจากเครื่อง!
                </p>

                <!-- Featured Mod Quick Link -->
                <div class="pt-2 flex flex-wrap items-center gap-3">
                    <button onclick="openModDetails('mod-atomic')" class="bg-purple-950/90 hover:bg-purple-900 border border-purple-500/60 text-purple-200 text-xs font-semibold px-4 py-2.5 rounded-2xl flex items-center gap-2 transition group shadow-md">
                        <i class="fa-solid fa-wand-magic-sparkles text-amber-400 group-hover:rotate-12 transition"></i>
                        <span>แนะนำ: สกิลมอด I AM ATOMIC ( Bedrock Script API )</span>
                        <i class="fa-solid fa-arrow-right text-[10px] text-purple-400 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Controls Section -->
        <section class="space-y-4">
            <!-- DEVICE PLATFORM FILTER TABS -->
            <div class="bg-slate-950/80 p-2.5 rounded-2xl border border-slate-800/90 flex flex-wrap items-center justify-between gap-3 shadow-lg">
                <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar w-full sm:w-auto pb-1 sm:pb-0" id="platformTabs">
                    <!-- Platform tabs rendered via JS -->
                </div>

                <div class="text-[11px] text-slate-400 flex items-center gap-2 px-2">
                    <i class="fa-solid fa-sliders text-purple-400"></i>
                    <span>เลือกอุปกรณ์เพื่อกรองมอดที่ตรงกับเครื่องคุณ</span>
                </div>
            </div>

            <!-- Categories & Sorting Row -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
                
                <!-- Category Tabs -->
                <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar w-full sm:w-auto pb-2 sm:pb-0" id="categoryTabs">
                    <!-- Categories rendered via JS -->
                </div>

                <!-- Sort & Display Count -->
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end text-xs text-slate-400">
                    <span id="resultCount" class="font-medium text-slate-300">กำลังโหลดรายการมอด...</span>
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500">เรียงตาม:</span>
                        <select id="sortSelect" onchange="applyFilters()" class="bg-slate-900 border border-slate-700/80 text-slate-200 px-3 py-1.5 rounded-xl focus:outline-none focus:border-purple-500">
                            <option value="downloads">ยอดดาวน์โหลดสูงสุด</option>
                            <option value="rating">คะแนนรีวิวสูงสุด</option>
                            <option value="likes">จำนวนคนถูกใจ</option>
                            <option value="newest">อัปเดตล่าสุด</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tag Chips -->
            <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar py-1" id="tagChipsContainer">
                <!-- Tags populated dynamically -->
            </div>
        </section>

        <!-- Mods Grid Gallery -->
        <section>
            <div id="modsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Mod cards rendered dynamically -->
            </div>

            <!-- Empty Search State -->
            <div id="emptyState" class="hidden text-center py-20 space-y-4 glass-card rounded-3xl border border-dashed border-slate-800">
                <div class="w-20 h-20 mx-auto rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-purple-400 text-3xl">
                    <i class="fa-solid fa-compass-drafting"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-200">ไม่พบมอดตามเงื่อนไขที่คุณเลือก</h3>
                <p class="text-xs text-slate-400 max-w-sm mx-auto">ลองเปลี่ยนการกรองอุปกรณ์ หรือค้นหาด้วยคีย์เวิร์ดอื่น</p>
                <button onclick="resetAllFilters()" class="bg-purple-900/60 hover:bg-purple-800 border border-purple-500/40 text-purple-200 text-xs font-medium px-5 py-2.5 rounded-2xl transition">
                    ล้างตัวกรองทั้งหมด
                </button>
            </div>
        </section>
    </main>

    <!-- MODAL 1: Mod Details Pop-up -->
    <div id="detailsModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="glass-panel border border-purple-500/40 w-full max-w-3xl rounded-3xl shadow-2xl p-5 sm:p-8 max-h-[92vh] overflow-y-auto custom-scrollbar relative space-y-6 animate-modal-in">
            
            <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base w-9 h-9 rounded-full bg-slate-900/90 border border-slate-700 flex items-center justify-center transition z-20 hover:scale-110">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div id="detailsContent">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- MODAL 2: Upload New Mod Modal (Supports ALL File Extensions & Direct Images) -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="glass-panel border border-purple-500/40 w-full max-w-2xl rounded-3xl shadow-2xl p-5 sm:p-8 max-h-[92vh] overflow-y-auto custom-scrollbar relative space-y-5 animate-modal-in">
            
            <button onclick="closeUploadModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base w-9 h-9 rounded-full bg-slate-900/90 border border-slate-700 flex items-center justify-center transition z-20 hover:scale-110">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="space-y-1">
                <h2 class="text-xl font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-purple-400"></i> อัปโหลดแชร์มอดลง CraftHub
                </h2>
                <p class="text-xs text-slate-400">รองรับการอัปโหลดไฟล์มอดทุกชนิด (.mcaddon, .mcpack, .zip, .jar, .rar) และเลือกภาพจากอัลบั้มมือถือ/คอมพิวเตอร์ได้โดยตรง</p>
            </div>

            <!-- Upload Form -->
            <form id="uploadForm" onsubmit="handleUploadSubmit(event)" class="space-y-4 text-xs">
                
                <!-- Title & Author -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">ชื่อมอด / แอดออน *</label>
                        <input type="text" id="upTitle" required placeholder="เช่น Shadow Katana Skill Addon" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">ชื่อผู้สร้าง (Creator) *</label>
                        <input type="text" id="upAuthor" required placeholder="เช่น Steve_Master" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <!-- Platform Device Selection -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">อุปกรณ์ที่รองรับ *</label>
                        <select id="upPlatform" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                            <option value="Mobile">มือถือ (Mobile / PE)</option>
                            <option value="PC">คอมพิวเตอร์ (PC / Java)</option>
                            <option value="Both">รองรับทั้ง Mobile & PC</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">หมวดหมู่ *</label>
                        <select id="upCategory" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                            <option value="Add-ons">Add-ons (สคริปต์/สกิล)</option>
                            <option value="Texture Packs">Texture Packs</option>
                            <option value="Maps">Maps (แมพ/โลก)</option>
                            <option value="Shaders">Shaders & VFX</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-300 font-semibold mb-1">เวอร์ชันเกม</label>
                        <input type="text" id="upVersion" value="1.20.80+" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                    </div>
                </div>

                <!-- File & Image Upload Pickers -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    
                    <!-- Direct Image Picker -->
                    <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                        <label class="block text-slate-300 font-semibold flex items-center justify-between">
                            <span><i class="fa-solid fa-image text-purple-400 mr-1.5"></i> ภาพปกมอด</span>
                            <span class="text-[10px] text-slate-500">(เลือกจากคลังภาพ)</span>
                        </label>
                        <input type="file" id="upImageFile" accept="image/*" onchange="handleImageFileSelect(event)" class="hidden">
                        <div onclick="document.getElementById('upImageFile').click()" class="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl p-3 text-center cursor-pointer transition bg-slate-900/60 flex flex-col items-center justify-center min-h-[110px]">
                            <div id="imagePreviewBox" class="flex flex-col items-center space-y-1">
                                <i class="fa-solid fa-camera text-2xl text-purple-400 mb-1"></i>
                                <span class="text-slate-300 font-medium">กดเลือกรูปจากเครื่อง</span>
                                <span class="text-[10px] text-slate-500">.png, .jpg, .webp</span>
                            </div>
                        </div>
                    </div>

                    <!-- Direct Mod File Attachment Picker -->
                    <div class="bg-slate-950/90 p-3.5 rounded-2xl border border-slate-800 space-y-2">
                        <label class="block text-slate-300 font-semibold flex items-center justify-between">
                            <span><i class="fa-solid fa-file-zipper text-cyan-400 mr-1.5"></i> ไฟล์มอดต้นฉบับ *</span>
                            <span class="text-[10px] text-slate-500">(ไม่จำกัดนามสกุล)</span>
                        </label>
                        
                        <!-- Explicit file acceptance covering all Minecraft mod types -->
                        <input type="file" id="upModFile" accept=".mcaddon,.mcpack,.zip,.jar,.rar,.7z,application/octet-stream,application/zip" onchange="handleModFileSelect(event)" class="hidden">
                        
                        <div onclick="document.getElementById('upModFile').click()" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 rounded-xl p-3 text-center cursor-pointer transition bg-slate-900/60 flex flex-col items-center justify-center min-h-[110px]">
                            <div id="modFileBox" class="flex flex-col items-center space-y-1">
                                <i class="fa-solid fa-folder-open text-2xl text-cyan-400 mb-1"></i>
                                <span id="modFileNameText" class="text-slate-300 font-medium">กดเลือกไฟล์มอด (.mcaddon, .mcpack...)</span>
                                <span class="text-[10px] text-cyan-400 font-mono">.mcaddon, .mcpack, .zip, .jar, .rar</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-slate-300 font-semibold mb-1">คำอธิบายมอด *</label>
                    <textarea id="upDesc" rows="3" required placeholder="อธิบายจุดเด่น สกิล หรือวิธีใช้งานมอดของคุณ..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500 leading-relaxed"></textarea>
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-slate-300 font-semibold mb-1">แท็ก (คั่นด้วยเครื่องหมายจุลภาค , )</label>
                    <input type="text" id="upTags" placeholder="Mobile, Script API, PvP, Magic" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-purple-500">
                </div>

                <!-- Submit Buttons -->
                <div class="pt-2 flex items-center justify-end gap-3">
