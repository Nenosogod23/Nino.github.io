                    #${tag}
                </button>
            `).join('');
        }

        function applyFilters() {
            const sortVal = document.getElementById('sortSelect').value;

            let filtered = modsList.filter(mod => {
                const matchPlatform = activePlatform === 'All' || mod.platform === activePlatform || mod.platform === 'Both';
                const matchCat = activeCategory === 'All' || mod.category === activeCategory;
                const matchTag = activeTag === 'All' || mod.tags.includes(activeTag);

                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q || 
                    mod.title.toLowerCase().includes(q) || 
                    mod.author.toLowerCase().includes(q) ||
                    mod.description.toLowerCase().includes(q) ||
                    mod.tags.some(t => t.toLowerCase().includes(q));

                return matchPlatform && matchCat && matchTag && matchSearch;
            });

            if (sortVal === 'downloads') filtered.sort((a, b) => b.downloads - a.downloads);
            else if (sortVal === 'rating') filtered.sort((a, b) => b.rating - a.rating);
            else if (sortVal === 'likes') filtered.sort((a, b) => b.likes - a.likes);
            else if (sortVal === 'newest') filtered.sort((a, b) => b.id.localeCompare(a.id));

            renderGrid(filtered);
            document.getElementById('resultCount').innerText = `พบทั้งหมด ${filtered.length} รายการ`;
        }

