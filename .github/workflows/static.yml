            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(el => {
                el.classList.remove('border-purple-500', 'text-purple-300');
                el.classList.add('border-transparent');
            });

            document.getElementById('tab-' + tabId).classList.remove('hidden');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('border-purple-500', 'text-purple-300');
            activeBtn.classList.remove('border-transparent');
        }

        function handleImageFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                stagedImageDataUrl = e.target.result;
                const box = document.getElementById('imagePreviewBox');
                box.innerHTML = `
                    <img src="${stagedImageDataUrl}" class="h-20 w-auto rounded-lg object-cover border border-purple-500 shadow-md mb-1">
                    <span class="text-xs text-purple-300 font-semibold">เลือกรูปเรียบร้อยแล้ว</span>
                `;
            };
            reader.readAsDataURL(file);
        }

        function handleModFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            stagedModFile = file;
            const textElem = document.getElementById('modFileNameText');
            if (textElem) {
                textElem.innerText = `แนบไฟล์: ${file.name}`;
                textElem.classList.remove('text-slate-300');
                textElem.classList.add('text-cyan-300', 'font-bold');
            }
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadForm').reset();
            stagedImageDataUrl = null;
            stagedModFile = null;

            document.getElementById('imagePreviewBox').innerHTML = `
                <i class="fa-solid fa-camera text-2xl text-purple-400 mb-1"></i>
                <span class="text-slate-300 font-medium">กดเลือกรูปจากเครื่อง</span>
                <span class="text-[10px] text-slate-500">.png, .jpg, .webp</span>
            `;

            document.getElementById('modFileNameText').innerText = 'กดเลือกไฟล์มอด (.mcaddon, .mcpack...)';
            document.getElementById('modFileNameText').classList.remove('text-cyan-300', 'font-bold');
            document.getElementById('modFileNameText').classList.add('text-slate-300');
        }

        async function handleUploadSubmit(e) {
            e.preventDefault();

            const title = document.getElementById('upTitle').value.trim();
            const author = document.getElementById('upAuthor').value.trim();
            const platform = document.getElementById('upPlatform').value;
            const category = document.getElementById('upCategory').value;
            const version = document.getElementById('upVersion').value.trim() || '1.20+';
            const desc = document.getElementById('upDesc').value.trim();
            const tagsVal = document.getElementById('upTags').value.trim();

            const tags = tagsVal ? tagsVal.split(',').map(t => t.trim()) : [platform, category];
            const image = stagedImageDataUrl || 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=800&q=80';

            let fileExt = 'mcaddon';
            let fileDataPayload = null;

            // Read attached file as DataURL for true file download
            if (stagedModFile) {
                const nameParts = stagedModFile.name.split('.');
                fileExt = nameParts.length > 1 ? nameParts.pop().toLowerCase() : 'mcaddon';

                fileDataPayload = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => resolve(evt.target.result);
                    reader.readAsDataURL(stagedModFile);
                });
            }

            const newMod = {
                id: 'mod-' + Date.now(),
                title: title,
                author: author,
                category: category,
                platform: platform,
                rating: 5.0,
                downloads: 1,
                likes: 1,
                version: version,
                tags: tags,
                image: image,
                fileType: fileExt,
                uploadedFileData: fileDataPayload,
                uploadedFileName: stagedModFile ? stagedModFile.name : null,
                isLiked: false,
                description: desc,
                installGuide: platform === 'Mobile' ? 'เปิดไฟล์ด้วยแอป Minecraft บนสมาร์ทโฟน' : 'นำเข้าตัวเกมตามคู่มือชนิดไฟล์ .' + fileExt,
                changelog: 'v1.0.0: เปิดตัวไฟล์มอดลงระบบ CraftHub Universe',
                comments: []
            };

            modsList.unshift(newMod);
            saveState();
            closeUploadModal();
            applyFilters();

            showToast('🎉 อัปโหลดมอดของคุณสำเร็จ!', 'success');
        }

        async function downloadModFile(modId, event) {
            if (event) event.stopPropagation();

            const mod = modsList.find(m => m.id === modId);
            if (!mod) return;

            showToast(`กำลังเตรียมไฟล์ ${mod.title} สำหรับดาวน์โหลด...`, 'info');

            mod.downloads++;
            saveState();
            applyFilters();

            if (currentOpenModId === modId) {
                const dlElem = document.getElementById('detailDownloadsCount');
                if (dlElem) dlElem.innerText = formatCompactNum(mod.downloads) + ' ครั้ง';
            }

            try {
                // If user uploaded a custom file, trigger direct DataURL download
                if (mod.uploadedFileData) {
                    const a = document.createElement('a');
                    a.href = mod.uploadedFileData;
                    a.download = mod.uploadedFileName || `${mod.title}.${mod.fileType}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    showToast(`ดาวน์โหลดไฟล์ ${mod.title} สำเร็จ!`, 'success');
                    return;
                }

                // Dynamic Generation for Presets (I AM ATOMIC and defaults)
                const zip = new JSZip();

                const manifest = {
                    "format_version": 2,
                    "header": {
                        "name": mod.title,
                        "description": mod.description.substring(0, 80),
                        "uuid": generateUUID(),
                        "version": [1, 0, 0],
                        "min_engine_version": [1, 20, 80]
                    },
                    "modules": [
                        {
                            "type": "script",
                            "language": "javascript",
                            "uuid": generateUUID(),
                            "version": [1, 0, 0],
                            "entry": "scripts/main.js"
                        }
                    ],
                    "dependencies": [
                        {
                            "module_name": "@minecraft/server",
                            "version": "1.10.0"
                        }
                    ]
                };

                let mainScript = `import { world } from "@minecraft/server";\nconsole.warn("${mod.title} Loaded Successfully!");`;

                if (mod.id === 'mod-atomic' || mod.title.includes('ATOMIC')) {
                    mainScript = `import { world, system } from "@minecraft/server";

const TRIGGER_ITEM = "minecraft:diamond_sword";

world.beforeEvents.itemUse.subscribe((event) => {
    const player = event.source;
    const item = event.itemStack;

    if (item && item.typeId === TRIGGER_ITEM) {
        system.run(() => {
            castIAmAtomic(player);
        });
    }
});

function castIAmAtomic(player) {
    const dimension = player.dimension;
    const location = player.location;

    world.sendMessage("§d§l[Shadow] §fI... AM...");
    player.onScreenDisplay.setTitle("§d§lI AM ATOMIC", {
        subtitle: "§5§l[ ALL RANGE ATOMIC ]",
        fadeInDuration: 5,
        stayDuration: 40,
        fadeOutDuration: 10
    });

    for (let i = 0; i < 360; i += 15) {
        const rad = (i * Math.PI) / 180;
        const x = location.x + Math.cos(rad) * 3;
        const z = location.y;
        const y = location.z + Math.sin(rad) * 3;
        dimension.spawnParticle("minecraft:dragon_destroy_block", { x: x, y: location.y + 1, z: y });
    }

    system.runTimeout(() => {
        const radius = 25;
        dimension.playSound("random.explode", location, { volume: 5.0, pitch: 0.5 });
        dimension.playSound("ambient.weather.lightning.impact", location, { volume: 5.0, pitch: 1.0 });

        for (let x = -radius; x <= radius; x += 3) {
            for (let z = -radius; z <= radius; z += 3) {
                if (x * x + z * z <= radius * radius) {
                    const pos = { x: location.x + x, y: location.y + 0.5, z: location.z + z };
                    dimension.spawnParticle("minecraft:end_rod", pos);
                    dimension.spawnParticle("minecraft:huge_explosion_lab_clean_smoke", pos);
                }
            }
        }

        const targets = dimension.getEntities({ location: location, maxDistance: radius, excludeEntities: [player] });
        for (const target of targets) {
            target.applyDamage(200, { cause: "entityExplosion", damagingEntity: player });
            const dirX = target.location.x - location.x;
            const dirZ = target.location.z - location.z;
            target.applyKnockback(dirX, dirZ, 3.0, 1.5);
        }
    }, 10);
}`;
                }

                zip.file("manifest.json", JSON.stringify(manifest, null, 2));
                zip.file("scripts/main.js", mainScript);
                zip.file("pack_icon.png", "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==", {base64: true});

                const blob = await zip.generateAsync({ type: "blob" });
                const fileName = `${mod.title.replace(/[^a-zA-Z0-9_-]/g, '_')}.${mod.fileType}`;

                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                showToast(`เริ่มดาวน์โหลดไฟล์ ${fileName} เรียบร้อยแล้ว!`, 'success');
            } catch (err) {
                console.error(err);
                showToast('เกิดข้อผิดพลาดในการสร้างไฟล์ดาวน์โหลด', 'error');
            }
        }

        // UTILITY FUNCTIONS
        function selectPlatform(platId) {
            activePlatform = platId;
            renderPlatformTabs();
            applyFilters();
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            applyFilters();
        }

        function selectTag(tag) {
            activeTag = tag;
            renderTagChips();
            applyFilters();
        }

        function toggleCardLike(modId, e) {
            if (e) e.stopPropagation();
            const mod = modsList.find(m => m.id === modId);
            if (!mod) return;

            mod.isLiked = !mod.isLiked;
            mod.likes += mod.isLiked ? 1 : -1;
            saveState();
            applyFilters();
            showToast(mod.isLiked ? 'เพิ่มลงในมอดที่ถูกใจแล้ว' : 'ยกเลิกการถูกใจแล้ว', 'info');
        }

        function toggleModalLike(modId) {
            const mod = modsList.find(m => m.id === modId);
            if (!mod) return;

            mod.isLiked = !mod.isLiked;
            mod.likes += mod.isLiked ? 1 : -1;
            saveState();

            document.getElementById('detailLikesCount').innerText = mod.likes;
            const btn = document.getElementById('modalLikeBtn');
            btn.querySelector('i').classList.toggle('text-rose-500', mod.isLiked);
            applyFilters();
        }

        function submitComment(modId) {
            const input = document.getElementById('modalCommentInput');
            const text = input ? input.value.trim() : '';
            if (!text) return;

            const mod = modsList.find(m => m.id === modId);
            if (!mod) return;

            if (!mod.comments) mod.comments = [];
            mod.comments.unshift({
                user: 'User_' + Math.floor(1000 + Math.random() * 9000),
                text: text,
                date: 'เมื่อสักครู่นี้'
            });

            saveState();
            openModDetails(modId);
            showToast('ขอบคุณสำหรับความคิดเห็น!', 'success');
        }

        function handleSearchInput() {
            searchQuery = document.getElementById('searchInput').value;
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchQuery) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            applyFilters();
        }

        function syncSearchMobile() {
            searchQuery = document.getElementById('mobileSearchInput').value;
            document.getElementById('searchInput').value = searchQuery;
            applyFilters();
        }

        function clearSearch() {
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            applyFilters();
        }

        function resetAllFilters() {
            activePlatform = 'All';
            activeCategory = 'All';
            activeTag = 'All';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            renderPlatformTabs();
            renderCategoryTabs();
            renderTagChips();
            applyFilters();
        }

        function saveState() {
            localStorage.setItem('crafthub_mods_v4', JSON.stringify(modsList));
        }

        function formatCompactNum(num) {
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num;
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-900 border-purple-500/50 text-purple-200';
            if (type === 'success') bg = 'bg-slate-900 border-emerald-500/50 text-emerald-200';
            if (type === 'error') bg = 'bg-slate-900 border-rose-500/50 text-rose-200';

            toast.className = `toast-animation p-3.5 rounded-2xl border ${bg} text-xs shadow-2xl flex items-center gap-2 max-w-xs backdrop-blur-md pointer-events-auto`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-purple-400'} text-base"></i>
                <span>${msg}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
```
